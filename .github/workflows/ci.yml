name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: ESLint
        working-directory: frontend
        run: npx eslint src --max-warnings=0 || true

  validate-backend:
    name: Validar sintaxis backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm install

      - name: Verificar sintaxis de todos los archivos JS
        working-directory: backend
        run: |
          find src -name "*.js" | while read f; do
            node --check "$f" || exit 1
          done
          echo "Todos los archivos pasan la verificación de sintaxis"

      - name: ESLint backend
        working-directory: backend
        run: npx eslint src --max-warnings=0 || true
